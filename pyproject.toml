[project]
name = "memory-narrative-engine"
version = "0.1.0"
description = "A reusable AI backend that generates narrative continuations for games/simulations using Cognee Cloud for persistent memory and Mistral for story generation."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "mistralai>=1.2.0",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
